<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="100%" height="100%">
  <defs>
    <linearGradient id="glass-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#bfe0f8"/>
    </linearGradient>
    <linearGradient id="glass-door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#dbe3ea"/>
    </linearGradient>
    <linearGradient id="frame-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36393e"/>
      <stop offset="100%" stop-color="#23272a"/>
    </linearGradient>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 8 M 8 0 L 0 8" fill="none" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="mesh-dark" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="336" height="316" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
    <g filter="url(#shadow)">
      <rect x="25" y="20" width="290" height="280" fill="#2d3748" rx="2"/>
      <!-- 3 Tier Awning -->
      
        <rect x="35" y="30" width="270" height="80" fill="#1e293b"/>
        <rect x="42" y="37" width="256" height="66" fill="url(#glass-blue)"/>
        <path d="M 42 37 L 170 103 L 298 37" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
      
        <rect x="35" y="118" width="270" height="80" fill="#1e293b"/>
        <rect x="42" y="125" width="256" height="66" fill="url(#glass-blue)"/>
        <path d="M 42 125 L 170 191 L 298 125" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
      
        <rect x="35" y="206" width="270" height="80" fill="#1e293b"/>
        <rect x="42" y="213" width="256" height="66" fill="url(#glass-blue)"/>
        <path d="M 42 213 L 170 279 L 298 213" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4"/>
      
    </g>
  
</svg>