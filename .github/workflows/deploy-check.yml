name: Deploy check (temporary)

# TEMPORARY. Confirms the production deployment really contains the mobile fix
# and the new library button, by reading the deployed HTML/CSS/JS bundles.
# Publishes its report to .arena-verify/report.txt on this branch, then is removed.

on:
  push:
    branches: ["arena/01a0c60d-azarraga-app-official"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect the deployed bundle
        continue-on-error: true
        run: |
          {
          set +e
          BASE="https://azarragaglass.vercel.app"
          PASS=0; FAIL=0
          ok(){ echo "  [PASS] $*"; PASS=$((PASS+1)); }
          bad(){ echo "  [FAIL] $*"; FAIL=$((FAIL+1)); }
          hdr(){ echo; echo "=== $* ==="; }
          echo "checked: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          hdr "1. Page + API respond"
          PC=$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE/")
          echo "home HTTP $PC, $(wc -c < /tmp/home.html) bytes"
          [ "$PC" = "200" ] && ok "homepage serves" || bad "homepage HTTP $PC"
          API=$(curl -sS -o /tmp/over.json -w '%{http_code}' "$BASE/api/admin/overview")
          echo "overview HTTP $API $(cat /tmp/over.json)"
          [ "$API" = "200" ] && ok "API serves" || bad "API HTTP $API"

          hdr "2. Mobile CSS fix is in the deployed stylesheet"
          CSSES=$(grep -o '/_next/static/css/[A-Za-z0-9._-]*\.css' /tmp/home.html | sort -u)
          echo "stylesheets: $(echo "$CSSES" | wc -l)"
          FOUND_HIDE=0; FOUND_STACK=0; FOUND_OVERFLOW=0
          for c in $CSSES; do
            curl -sS "$BASE$c" -o /tmp/sheet.css
            grep -q "overflow-x:hidden\|overflow-x: hidden" /tmp/sheet.css && FOUND_OVERFLOW=1
            grep -q "admin-table thead" /tmp/sheet.css && FOUND_HIDE=1
            grep -q "quote-table thead" /tmp/sheet.css && FOUND_STACK=1
          done
          [ "$FOUND_OVERFLOW" = "1" ] && ok "no-sideways-scroll rule present" || bad "overflow-x rule missing"
          [ "$FOUND_HIDE" = "1" ] && ok "admin table stacking rule present" || bad "admin table stacking missing"
          [ "$FOUND_STACK" = "1" ] && ok "quotation table stacking rule present" || bad "quotation table stacking missing"

          hdr "3. New library button is in the deployed JS"
          JSES=$(grep -o '/_next/static/chunks/[A-Za-z0-9._/-]*\.js' /tmp/home.html | sort -u)
          echo "chunks referenced in HTML: $(echo "$JSES" | wc -l)"
          MATCH=0; AUTOBTN=0
          for j in $JSES; do
            curl -sS "$BASE$j" -o /tmp/chunk.js 2>/dev/null
            grep -q "Match names to products" /tmp/chunk.js && MATCH=1
            grep -q "autoAssignByFilename\|Image Library" /tmp/chunk.js && AUTOBTN=1
          done
          if [ "$MATCH" != "1" ]; then
            # client chunks are loaded on demand; probe the build manifest for all chunk names
            curl -sS "$BASE/_next/static/chunks/app/page.js" -o /tmp/page.js
            grep -q "Match names to products" /tmp/page.js && MATCH=1
            grep -q "Image Library" /tmp/page.js && AUTOBTN=1
            for j in $(curl -sS "$BASE/_next/static/chunks/app/page.js" | grep -o '/_next/static/chunks/[A-Za-z0-9._/-]*\.js' | sort -u); do
              curl -sS "$BASE$j" -o /tmp/chunk2.js 2>/dev/null
              grep -q "Match names to products" /tmp/chunk2.js && MATCH=1
            done
          fi
          [ "$MATCH" = "1" ] && ok "'Match names to products' shipped in the bundle" || bad "new button not found in bundles"
          [ "$AUTOBTN" = "1" ] && ok "Image Library UI shipped" || echo "  [INFO] Image Library string not located (chunk splitting)"

          hdr "4. Live data"
          curl -sS "$BASE/api/media" -o /tmp/media.json
          echo "library images: $(jq '.media|length' /tmp/media.json)"
          echo "attached to products: $(jq '[.media[]|select((.usedBy|length)>0)]|length' /tmp/media.json)"
          echo "products: $(jq '.totalProducts' /tmp/over.json), media: $(jq '.totalMedia' /tmp/over.json)"

          hdr "SUMMARY"
          echo "PASS=$PASS FAIL=$FAIL"
          [ "$FAIL" -eq 0 ] && echo "RESULT: DEPLOYMOST VERIFIED" || echo "RESULT: PROBLEMS FOUND"
          } 2>&1 | tee /tmp/report.txt

      - name: Publish report
        if: always()
        run: |
          set +e
          git config user.name "arena-live-verify"
          git config user.email "arena-live-verify@users.noreply.github.com"
          mkdir -p .arena-verify
          cp /tmp/report.txt .arena-verify/report.txt
          git add -f .arena-verify/report.txt
          git commit -m "chore: deploy check report [skip ci]"
          git push origin HEAD:arena/01a0c60d-azarraga-app-official
