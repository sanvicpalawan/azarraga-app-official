name: Live write test (temporary)

# TEMPORARY. Verifies the production deployment's write paths from a runner with
# public internet access. Everything it creates (one product) is deleted in the
# same run; the seeded products are never modified. Report is written to
# .arena-verify/report.txt on this branch so it can be read without log access.

on:
  push:
    branches: ["arena/01a0c60d-azarraga-app-official"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write round-trip on production
        continue-on-error: true
        run: |
          {
          set +e
          BASE="https://azarragaglass.vercel.app"
          PASS=0; FAIL=0
          ok(){ echo "  [PASS] $*"; PASS=$((PASS+1)); }
          bad(){ echo "  [FAIL] $*"; FAIL=$((FAIL+1)); }
          hdr(){ echo; echo "=== $* ==="; }
          echo "run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          PRODUCT_ID=""; MEDIA_ID=""
          cleanup(){
            if [ -n "$PRODUCT_ID" ]; then
              echo "!! cleanup product $PRODUCT_ID"
              curl -sS -X DELETE "$BASE/api/products/$PRODUCT_ID" -w ' -> HTTP %{http_code}\n' || true
            fi
          }
          trap cleanup EXIT

          hdr "0. Baseline"
          curl -sS -o /tmp/over.json -w 'overview HTTP %{http_code}\n' "$BASE/api/admin/overview"
          cat /tmp/over.json; echo
          BASE_PRODUCTS=$(jq '.totalProducts' /tmp/over.json)
          BASE_MEDIA=$(jq '.totalMedia' /tmp/over.json)

          hdr "1. Create a product (INSERT into Neon)"
          RESP=$(curl -sS -X POST "$BASE/api/products" -H 'content-type: application/json' \
            -d '{"name":"ZZ Arena Write Test (auto-delete)","categoryId":3,"basePrice":0,"description":"Temporary.","defaultSeriesId":null,"defaultGlassId":null}' \
            -w '\n%{http_code}')
          CODE=$(tail -n1 <<<"$RESP"); BODY=$(sed '$d' <<<"$RESP")
          PRODUCT_ID=$(jq -r '.id // empty' <<<"$BODY" 2>/dev/null)
          echo "HTTP $CODE body=$BODY"
          if [ "$CODE" = "201" ] && [ -n "$PRODUCT_ID" ]; then ok "product INSERT (id=$PRODUCT_ID)"; else bad "product INSERT HTTP $CODE"; fi

          hdr "2. Read it back (separate request)"
          curl -sS "$BASE/api/products" -o /tmp/prods.json
          FOUND=$(jq --argjson id "${PRODUCT_ID:-0}" '[.products[]|select(.id==$id)]|length' /tmp/prods.json 2>/dev/null)
          echo "products=$(jq '.products|length' /tmp/prods.json) (baseline $BASE_PRODUCTS), matches=$FOUND"
          if [ "$FOUND" = "1" ]; then ok "product persisted"; else bad "product not readable"; fi

          hdr "3. Attach a library image (PUT /api/products/:id/image)"
          MEDIA_ID=$(curl -sS "$BASE/api/media" | jq -r '.media[0].id // empty')
          echo "using existing library image id=$MEDIA_ID"
          if [ -n "$MEDIA_ID" ] && [ -n "$PRODUCT_ID" ]; then
            ACODE=$(curl -sS -X PUT "$BASE/api/products/$PRODUCT_ID/image" \
              -H 'content-type: application/json' -d "{\"mediaId\":$MEDIA_ID}" \
              -o /tmp/att.json -w '%{http_code}')
            echo "attach HTTP $ACODE body=$(head -c 160 /tmp/att.json)"
            if [ "$ACODE" = "200" ]; then ok "library image attached"; else bad "attach HTTP $ACODE"; fi

            hdr "4. Read-back: does the product report an image?"
            curl -sS "$BASE/api/products" -o /tmp/prods2.json
            IMG=$(jq -r --argjson id "$PRODUCT_ID" '.products[]|select(.id==$id)|.imageUrl' /tmp/prods2.json)
            echo "product imageUrl=$IMG"
            if [ -n "$IMG" ] && [ "$IMG" != "null" ]; then ok "product now has imageUrl"; else bad "product imageUrl still empty"; fi

            hdr "5. Read-back: does the library show it in use?"
            curl -sS "$BASE/api/media" -o /tmp/media.json
            USED=$(jq -r --argjson id "$MEDIA_ID" '.media[]|select(.id==$id)|.usedBy|length' /tmp/media.json)
            echo "media $MEDIA_ID usedBy=$USED"
            if [ "$USED" != "0" ] && [ -n "$USED" ]; then ok "library shows the product as user"; else bad "library shows no user (attach silently failed)"; fi

            hdr "6. Serve the image bytes"
            SCODE=$(curl -sS -o /tmp/img.bin -w '%{http_code}' "$BASE/api/products/$PRODUCT_ID/image")
            echo "image HTTP $SCODE bytes=$(wc -c < /tmp/img.bin)"
            if [ "$SCODE" = "200" ]; then ok "product image serves"; else bad "product image HTTP $SCODE"; fi

            hdr "7. Unlink (image must stay in the library)"
            DCODE=$(curl -sS -X DELETE "$BASE/api/products/$PRODUCT_ID/image" -o /tmp/unlink.json -w '%{http_code}')
            echo "unlink HTTP $DCODE"
            STILL=$(curl -sS "$BASE/api/media" | jq -r --argjson id "$MEDIA_ID" '[.media[]|select(.id==$id)]|length')
            echo "image still in library: $STILL"
            if [ "$DCODE" = "200" ] && [ "$STILL" = "1" ]; then ok "unlink keeps the library image"; else bad "unlink behaviour wrong (HTTP $DCODE, in library=$STILL)"; fi
          else
            bad "no library image available to attach"
          fi

          hdr "8. Cleanup"
          if [ -n "$PRODUCT_ID" ]; then
            XCODE=$(curl -sS -X DELETE "$BASE/api/products/$PRODUCT_ID" -o /dev/null -w '%{http_code}')
            echo "delete product HTTP $XCODE"
            if [ "$XCODE" = "200" ]; then ok "test product deleted"; else bad "delete HTTP $XCODE"; fi
            PRODUCT_ID=""
          fi
          curl -sS "$BASE/api/admin/overview" -o /tmp/final.json
          echo "final: $(cat /tmp/final.json)"
          FP=$(jq '.totalProducts' /tmp/final.json)
          if [ "$FP" = "$BASE_PRODUCTS" ]; then ok "catalog restored ($FP products, baseline $BASE_PRODUCTS)"; else bad "product count changed: $BASE_PRODUCTS -> $FP"; fi

          hdr "SUMMARY"
          echo "PASS=$PASS FAIL=$FAIL"
          if [ "$FAIL" -ne 0 ]; then echo "RESULT: FAILURES PRESENT"; else echo "RESULT: ALL CHECKS PASSED"; fi
          } 2>&1 | tee /tmp/report.txt

      - name: Publish report
        if: always()
        run: |
          set +e
          git config user.name "arena-live-verify"
          git config user.email "arena-live-verify@users.noreply.github.com"
          mkdir -p .arena-verify
          cp /tmp/report.txt .arena-verify/report.txt
          git add -f .arena-verify/report.txt
          git commit -m "chore: live write test report [skip ci]"
          git push origin HEAD:arena/01a0c60d-azarraga-app-official
